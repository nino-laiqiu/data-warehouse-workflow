# 门禁定义。gate 在本文件里是"可执行的判定"，不是"评审意见"
#
# 约定：type: auto 的 gate 由脚本判；带 hitl 字段的 gate 还要人在场签字才能过。
# 全流程只有 3 个 HITL：H1 口径确认（G1）、H2 方案裁决评审（G3）、H3 上线放行（G5）。
version: 2

principle:
  - 门禁只允许拦截，不允许自动修改产物
  - 每个 gate 的失败必须给出机器可读原因，否则等于没定
  - HITL 全局只有 3 个卡点，多一个就没人用

lane_b:
  - id: G0
    name: 需求入库合规
    type: auto
    checks:
      - 来源齐全：提出人、渠道、时间三样缺一不可
      - 原始文件自入库起未被修改（sha256 与 journal 记录一致）
      - 用的是 requirements/templates/REQ-template.md，5 段不缺
      - 与已有需求重复的，已标注关联编号而不是新建
    on_fail: 拒绝入库，退回需求方补来源

  - id: G1
    name: 翻译可执行
    type: auto
    hitl: H1 口径确认
    checks:
      - 8 段齐全（目标/口径/输入/输出/边界/验收/不做什么/待确认项）
      - 「待确认项」为空——非空说明还有歧义没消
      - 引用的本体 id 全部存在且 status 不为 deprecated（sk-ont-validate）
      - 验收标准可断言（有数值或明确条件），不是"数据准确"这类废话
    on_fail: 退回 P1；H1 未签字不许进 P2

  - id: G2
    name: 双轨独立完成
    type: auto
    checks:
      - 两轨都有 sql/、design-notes.md、self-check.md，缺一即失败
      - 两轨 SQL 的 sha256 不相同（相同 = 抄袭或串通，双轨失去意义）
      - journal 中无跨轨读取事件（developer-1 读 track-2 或反之）
      - design-notes 里标记 needs-confirmation 的假设，不得同时出现在已完成产出中
    on_fail: 作废该轮双轨，重跑 P2，并记录违规

  - id: G3
    name: 裁决合格
    type: auto
    hitl: H2 方案裁决评审
    checks:
      - comparison.md 覆盖两轨全部差异（漏报一个差异即失败）
      - 每条裁决都带依据引用（本体 id 或知识库条目），不接受"我觉得"
      - final/ 全部脚本通过 sk-sql-guard
      - final/ 中与所选轨道不一致的改动，已逐条写进对比报告
    on_fail: 退回 P3 重新比对；口径冲突则退回 P1

  - id: G4
    name: 质量规则就绪
    type: auto
    check: python tools/check_dq.py requirements/<需求目录>/需求开发员/质量/dq_rules.json
    checks:
      - 每条 DQ 规则可执行（有 SQL 或断言），不允许"人工检查"
      - 至少覆盖空值、重复、单调性三类
    on_fail: 退回 P4

  - id: G5
    name: 上线放行
    type: hitl
    hitl: H3 上线放行
    check: python tools/check_lineage.py requirements/<需求目录>/需求开发员/血缘/lineage.json
    checks:
      - 血缘图完整，无孤立表
      - 调度依赖已声明，且不形成环
      - 回滚方案已写
      - 验证报告 signoff 为 passed，或为 waived 且带 reason/expires_at/followup_todo
    rules:
      - pending 的报告不许签 G5——"没证据"和"证据不足"是两回事
      - waived 到期未补现网证据，本门禁自动回到未放行（巡检每周复查）
      - 豁免只能签"进测试环境"，进生产必须 passed
    on_fail: 挂起等人

  - id: G6
    name: 交付完整
    type: auto
    checks:
      - 表注释、字段注释齐全
      - 口径变更说明已写（改了哪个指标的哪个边界，为什么）
    on_fail: 退回 P6

lane_a:
  - id: GA1
    name: 口径明确
    type: auto
    checks:
      - 问题里的指标必须命中 ontology 的唯一口径，命中多个则要求用户澄清
      - 时间范围与粒度明确
    on_fail: 反问用户，不猜

  - id: GA2
    name: SQL 安全
    type: auto
    checks:
      - 只读（SELECT/WITH），无 DDL/DML
      - 必须带 dt 过滤且范围 <=90 天
      - LIMIT 2000
      - 无 SELECT *
      - JOIN 数 <=3
    on_fail: 拒绝执行，返回改写建议

  - id: GA3
    name: 结果可信
    type: auto
    checks:
      - 查询返回非空，或明确解释为空的原因
      - 量级与历史同口径对比偏差 <=50%（超出要求人工确认）
      - 结论中不含因果断言
    on_fail: 标记"结果待确认"，不直接给结论

# 豁免记录：任何豁免都要落盘，口头同意不算
waivers:
  file: memory/rulings/waivers.json
  required_fields: [gate, run_id, reason, approved_by, expires_at]

  # 定稿口径变更后（P3 之后又改了需求稿），必须补一次产物对齐复核，
  # 否则"需求改了、SQL 还是旧的"没人会发现。复核记录放 监督者/复核/。
  G3_recheck:
    when: 需求稿在 G1 通过后被再次确认（req_review confirm 覆盖了旧基线）
    need: 监督者/复核/<REQ>-口径对齐.md，逐条列出 一致 / 已改 / 保留偏差
    fail_if: 有偏差但既没改、也没写进交付文档
