# 两条车道的 stage 定义。改这里之前先读 docs/设计文档-数仓智能开发工作流.md §6
#
# 每个 stage 必须显式声明 skills（没有就写 []），这是"这一步调用什么技能"的唯一权威来源。
# 改完跑：python tools/check_skills.py
version: 2

defaults:
  handoff: json_contract        # 只允许 JSON 契约交接，禁止自然语言
  contract_dir: contracts/
  run_dir: runs/<run_id>/        # 仅 A 线用；B 线的 run 目录就是需求目录，不另建
  fail_fast: true               # 缺字段即失败，不做"合理推断"

lane_b_develop:
  purpose: 数仓开发工程师：需求 → 双轨实现 → 比对裁决 → 可上线的表与指标
  cadence: day
  tracks: 2                     # 双轨制：同一份翻译稿，两个独立实现
  stages:
    - id: P0
      name: 需求入库
      agent: requirement-translator（收需求 + 登记，人只负责把原件放进 反馈者/）
      skills: [sk-req-register]
      in: 原始需求（群/邮件/会议/工单）
      out: requirements/<需求目录>/反馈者/REQ-*.md + sha256 登记
      gate: G0

    - id: P1
      name: 需求翻译
      agent: requirement-translator
      skills: [sk-req-validate, sk-ont-validate]
      in: inbox 原始需求
      out: requirements/<需求目录>/需求分析员/REQ-*.md（8 段，待确认项为空）
      gate: G1                # 含 HITL：H1 口径确认

    - id: P2
      name: 双轨开发
      agent: developer-1 ∥ developer-2（并行，互不可见）
      skills: [sk-sql-ddl, sk-sql-dml, sk-sql-guard]
      in: requirements/<需求目录>/需求分析员/REQ-*.md 翻译稿 + ontology + knowledge
      out: requirements/<需求目录>/需求开发员/developer-{1,2}/（sql + design-notes.md + self-check.md）
      gate: G2

    - id: P3
      name: 监督比对
      agent: supervisor
      skills: [sk-sql-diff, sk-sql-guard]
      in: track-1 + track-2
      out: requirements/<需求目录>/需求开发员/监督者/{comparison.md,verdict.md,final/}
      gate: G3                # 含 HITL：H2 方案裁决评审

    - id: P4
      name: 质量规则
      agent: requirement-translator   # 验收标准 → 可执行规则，仍属定义侧
      skills: [sk-dq-gen]
      in: final/ + metric_spec
      out: dq_rules
      gate: G4

    - id: P5
      name: 血缘与调度
      agent: developer-1              # 裁决后隔离解除，由实现者自己落地调度
      skills: [sk-lin-build]
      in: final/ + dq_rules
      out: lineage + dag
      gate: G5                # 含 HITL：H3 上线放行

    - id: P6
      name: 文档交付
      agent: chronicler               # 交付文档 = 记录的产物，素材是 journal + final
      skills: [sk-doc-assemble]
      in: 以上全部
      out: 交付文档 + 口径变更说明
      gate: G6

lane_a_analyze:
  purpose: 数据分析人员：问一个数，拿到可信结果与可复现的 SQL
  cadence: minute
  stages:
    - id: A1
      name: 意图解析
      agent: 无（skill 直调）
      skills: [sk-qry-intent]
      in: 自然语言问题
      out: intent
      gate: GA1

    - id: A2
      name: 找数定位
      agent: 无（skill 直调）
      skills: [sk-qry-locate]
      in: intent
      out: 候选表与字段（ADS>DWS>DWD>ODS）
      gate: GA1

    - id: A3
      name: 查询生成
      agent: 无（skill 直调）
      skills: [sk-qry-gen, sk-sql-guard]   # 先生成，再过门禁；guard 与 B 线 P2 共用
      in: intent + 定位结果
      out: analysis
      gate: GA2

    - id: A4
      name: 结果自检
      agent: 无（skill 直调）
      skills: [sk-qry-check]
      in: analysis
      out: 自检报告
      gate: GA3

    - id: A5
      name: 结论生成
      agent: requirement-translator   # A 线由需求分析员兼岗（取数分析的问句解析同一套）
      skills: []
      in: 查询结果 + 自检报告
      out: 结论（禁用因果表述）
      gate: GA3

    - id: A6
      name: 沉淀
      agent: chronicler
      skills: []
      in: 本次 run
      out: memory/ 提案或 knowledge/ 范例
      gate: 无

# 横切角色：不属于任何单个 stage，但每个 stage 前后都要触发
cross_cutting:
  - role: chronicler
    writes: requirements/<需求目录>/需求开发员/journal.jsonl
    events: [conversation, artifact, gate]
    when: 每个 stage 开始与结束、每次产物变更、每次门禁判定

# 硬规则：写在流程定义里，不靠人记
hard_rules:
  - 双轨隔离：developer-1 与 developer-2 不得读取对方目录，违反即 G2 失败
  - P2 期间禁止任何"对齐一下"的沟通；分歧留到 P3 由 supervisor 裁决
  - 口径冲突一律退回 P1，supervisor 不得自行拍定
  - A 线 SQL 只能只读，且必须带 dt 分区过滤（<=90 天）
  - A 线结论不得使用因果表述，只能说"A 与 B 同向变化，可用这条 SQL 验证"
  - 任何 A 线产物要转正，必须走 B 线 P1 起
