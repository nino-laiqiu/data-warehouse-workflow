# 两条车道的 stage 定义。改这里之前先读 docs/设计文档-数仓智能开发工作流.md §6
#
# 每个 stage 必须显式声明 skills（没有就写 []），这是"这一步调用什么技能"的唯一权威来源。
# 改完跑：python tools/check_skills.py
version: 1

# 跨 stage 的公共约定
defaults:
  handoff: json_contract        # 只允许 JSON 契约交接，禁止自然语言
  contract_dir: contracts/
  run_dir: runs/<run_id>/
  fail_fast: true               # 缺字段即失败，不做"合理推断"

lane_b_develop:
  purpose: 数仓开发工程师：从需求到可上线的表与指标
  cadence: day
  stages:
    - id: P1
      name: 需求受理
      agent: requirement-analyst
      skills: []
      in: 口头/文档需求
      out: requirement
      gate: G1

    - id: P2
      name: 本体对齐
      agent: ontology-admin
      skills: [sk-ont-validate]
      in: requirement
      out: ontology_delta
      gate: G2

    - id: P3
      name: 维度建模
      agent: model-designer
      skills: []
      in: ontology_delta
      out: model_design
      gate: G3          # 含 HITL：建表评审

    - id: P4
      name: 指标定义
      agent: metric-owner
      skills: []
      in: model_design
      out: metric_spec
      gate: G4          # 含 HITL：口径确认

    - id: P5
      name: SQL 生成
      agent: 无（skill 直调）
      skills: [sk-sql-ddl, sk-sql-dml]
      in: model_design + metric_spec
      out: sql_scripts
      gate: G5

    - id: P6
      name: 质量规则
      agent: quality-engineer
      skills: []
      in: model_design + metric_spec
      out: dq_rules
      gate: G6

    - id: P7
      name: 血缘与调度
      agent: lineage-steward
      skills: []
      in: sql_scripts + dq_rules
      out: lineage
      gate: G7          # 含 HITL：上线放行

    - id: P8
      name: 文档交付
      agent: doc-writer
      skills: []
      in: 以上全部
      out: 文档与变更说明
      gate: G8

lane_a_analyze:
  purpose: 数据分析人员：问一个数，拿到可信结果与可复现的 SQL
  cadence: minute
  stages:
    - id: A1
      name: 意图解析
      agent: 无（skill 直调）
      skills: [sk-qry-intent]
      in: 自然语言问题
      out: intent
      gate: GA1

    - id: A2
      name: 找数定位
      agent: 无（skill 直调）
      skills: [sk-qry-locate]
      in: intent
      out: 候选表与字段（ADS>DWS>DWD>ODS）
      gate: GA1

    - id: A3
      name: 查询生成
      agent: 无（skill 直调）
      skills: [sk-qry-gen, sk-qry-guard]   # 先生成，再过门禁
      in: intent + 定位结果
      out: analysis
      gate: GA2

    - id: A4
      name: 结果自检
      agent: 无（skill 直调）
      skills: [sk-qry-check]
      in: analysis
      out: 自检报告
      gate: GA3

    - id: A5
      name: 结论生成
      agent: analyst-writer
      skills: []
      in: 查询结果 + 自检报告
      out: 结论（禁用因果表述）
      gate: GA3

    - id: A6
      name: 沉淀
      agent: orchestrator
      skills: []
      in: 本次 run
      out: memory/ 提案或 knowledge/ 范例
      gate: 无

# 硬规则：A 线产物永不进入生产调度
hard_rules:
  - A 线 SQL 只能只读，且必须带 dt 分区过滤（<=90 天）
  - A 线结论不得使用因果表述，只能说"A 与 B 同向变化，可用这条 SQL 验证"
  - 任何 A 线产物要转正，必须走 B 线 P4
