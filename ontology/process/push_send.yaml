id: PUSH_SEND
name: 推送下发
description: 圈选完成后实际提交给厂商的发送动作。包含被频控丢弃的记录（is_drop=1），丢弃记录不算发送成功
objects: [DEVICE]
event_time: send_time
measures:
  - id: M_PUSH_SEND_CNT
    additivity: additive
    description: 发送成功条数，求和口径
  - id: M_PUSH_DROP_CNT
    additivity: additive
    description: 被频控丢弃条数
source_tables:
  - ods_push_request_log_di
  - ods_push_send_receipt_di
owner: ontology-admin
status: draft
